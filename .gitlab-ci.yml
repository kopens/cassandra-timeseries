# CI for cassandra-timeseries: Apache Cassandra 6.0.0 + time-series functions.
# Builds apache-cassandra-6.0.0.jar with Ant, runs the time-series unit tests, then boots the
# Docker image and runs the time-series CQL integration test before anything is released.
#
# Release path (tag push) is fully automatic and gated:
#   build-jar -> timeseries-tests -> docker-image -> docker-integration-test -> docker-image-publish + release
# On the default branch the docker chain is manual (a full image build is expensive); play
# docker-image to run it.

stages:
  - build
  - test
  - image
  - integration
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

variables:
  # modules/accord is a git submodule and is required by the build.
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  ANT_OPTS: "-Xmx3g"   # 4g heap + metaspace/native exceeded the runner container cgroup during checkstyle (2,931 files) -> ant Killed; 3g leaves headroom on the smaller runners

default:
  image: eclipse-temurin:21-jdk
  before_script:
    # git: the temurin image ships without it, and build.xml's _get-git-sha then silently
    # falls back, stamping Implementation-Git-SHA: Unknown into the jar. That attribute is
    # the only way to trace a deployed jar back to a commit, so the build needs git present.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ant ant-optional python3 git > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR" || true

build-jar:
  stage: build
  timeout: 90m
  script:
    - ant clean jar checkstyle checkstyle-test
    - ls -l build/apache-cassandra-6.0.0.jar
    # Fail loudly if the jar was built without a resolvable commit: an unstamped jar cannot be
    # traced back from a deployed node, and _get-git-sha fails silently by design.
    - python3 .build/sh/check-jar-git-sha.py build/apache-cassandra-6.0.0.jar "$CI_COMMIT_SHA"
    # Release artifacts carry the fork's name and the tag's version (build.xml stays at
    # base.version 6.0.0 per the versioning rule - only the published copies are renamed).
    - cp build/apache-cassandra-6.0.0.jar "build/apache-cassandra-timeseries-${CI_COMMIT_TAG:-dev}.jar"
    # Full binary distribution (bin/, conf/, lib/, tools/ ...) as a tar.gz with a versioned top dir.
    - ant _artifacts-init -Dant.gen-doc.skip=true -Drat.skip=true
    - cp -al build/dist "build/apache-cassandra-timeseries-${CI_COMMIT_TAG:-dev}"
    - tar -C build -czf "build/apache-cassandra-timeseries-${CI_COMMIT_TAG:-dev}-bin.tar.gz" "apache-cassandra-timeseries-${CI_COMMIT_TAG:-dev}"
    - ls -l build/apache-cassandra-timeseries-*
  artifacts:
    name: "apache-cassandra-timeseries"
    paths:
      - build/apache-cassandra-6.0.0.jar
      - build/apache-cassandra-timeseries-*.jar
      - build/apache-cassandra-timeseries-*-bin.tar.gz
    expire_in: 1 month

# Targeted tests only — the full Cassandra suite takes hours (see AGENTS.md).
timeseries-tests:
  stage: test
  timeout: 90m
  # One line per class. Full per-class output goes to build/ci-logs/ and is kept as an
  # artifact -- jvm-dtests log at DEBUG and a single one can fill GitLab's 4 MiB trace
  # limit, which in the 6.0.0 release run happened during the SECOND class. The script
  # also reads failures/errors out of the JUnit XML instead of trusting ant's exit code,
  # because `ant testsome` reports BUILD SUCCESSFUL when a class name does not resolve.
  script:
    - .build/sh/ci-timeseries-tests.sh
  artifacts:
    name: "timeseries-test-logs"
    when: always
    paths:
      - build/ci-logs/
      - build/test/output/
    expire_in: 1 month

# Soak-style heap gate for the timeseries memtable read path: sustained interleaved writes and
# reads against one pinned memtable, verdict on the TREND of the retained footprint (see the
# class comment of TimeSeriesMemtableHeapSoakTest). This is the gate for the 2026-08-02 OOM
# class of failure — a leak whose signal is a slow monotonic trend that per-push unit tests
# structurally cannot see.
#
# Deliberately NOT in .build/sh/ci-timeseries-tests.sh: the soak alone runs ~10 minutes of
# sustained load on a quiet machine (plus the test build), which would roughly double the
# per-push battery for a test whose failure mode is not something a push introduces silently —
# so it runs on the nightly schedule instead (create one under CI/CD > Schedules; any cadence
# works, the job keys on the pipeline source). The ant timeout is raised above the default
# test.long.timeout because a FAILING soak is slower than a passing one (the leaked graph makes
# every jamm walk bigger), and a timeout verdict would eat the sample table that makes the
# failure diagnosable.
timeseries-heap-soak:
  stage: test
  timeout: 90m
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - mkdir -p build
    - ant long-testsome
      -Dtest.name=org.apache.cassandra.db.memtable.TimeSeriesMemtableHeapSoakTest
      -Dtest.long.timeout=3600000
      -Dant.gen-doc.skip=true -Drat.skip=true -Dno-checkstyle=true
      > build/heap-soak-ant.log 2>&1 || true
    - tail -n 40 build/heap-soak-ant.log
    # Read the verdict out of the JUnit XML, not ant's exit code: `ant long-testsome` reports
    # BUILD SUCCESSFUL having run nothing when the class name does not resolve (same reason
    # .build/sh/ci-timeseries-tests.sh exists).
    - |
      python3 - <<'PY'
      import re, sys
      path = "build/test/output/TEST-org.apache.cassandra.db.memtable.TimeSeriesMemtableHeapSoakTest.xml"
      try:
          head = open(path, encoding="utf-8", errors="replace").read(4000)
      except OSError:
          sys.exit("NO REPORT: the soak test did not run at all")
      m = re.search(r'<testsuite\b[^>]*', head)
      counts = {k: int(v) for k, v in re.findall(r'(tests|failures|errors)="(\d+)"', m.group(0) if m else "")}
      print("soak verdict:", counts)
      if not counts.get("tests") or counts.get("failures") or counts.get("errors"):
          sys.exit("timeseries heap soak FAILED -- see the sample table in build/test/output/")
      PY
  artifacts:
    name: "timeseries-heap-soak"
    when: always
    paths:
      - build/heap-soak-ant.log
      - build/test/output/timeseries-heap-soak-report.txt
      - build/test/output/TEST-org.apache.cassandra.db.memtable.TimeSeriesMemtableHeapSoakTest.xml
    expire_in: 1 month

# Build the Testcontainers-compatible Docker image (see docker/) and publish it as a loadable tarball to
# the GitLab GENERIC PACKAGE registry — this instance has no container registry configured (no
# registry_external_url, /jwt/auth 404), so $CI_REGISTRY_IMAGE is empty and a kaniko push cannot work.
# Switch --no-push/--tar-path back to --destination "$CI_REGISTRY_IMAGE:6.0.0" if a container registry
# is configured later.
#
# Consumption (e.g. before the plantpulse-jdbc-cassandra-driver integration tests):
#   curl -sH "PRIVATE-TOKEN: <token>" \
#     "$CI_API_V4_URL/projects/<id>/packages/generic/cassandra-timeseries-docker/<version>/cassandra-timeseries-6.0.0-docker.tar" \
#     | podman load   # or: docker load
#   ./gradlew integrationTest -Pcassandra.image=cassandra-timeseries:6.0.0
docker-image:
  stage: image
  timeout: 90m
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  # The kaniko image is busybox-based: the global before_script (apt-get) must not run here.
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile"
      --no-push
      --tar-path "$CI_PROJECT_DIR/cassandra-timeseries-6.0.0-docker.tar"
      --destination "cassandra-timeseries:6.0.0"
  artifacts:
    name: "cassandra-timeseries-6.0.0-docker"
    paths:
      - cassandra-timeseries-6.0.0-docker.tar
    expire_in: 3 days

# Release gate: boot the image that is about to be published and run the time-series CQL
# integration test against it (docker/integration-test.sh). Nothing is published or released
# unless this passes.
#
# Needs a Docker daemon, and uses the HOST's via the socket the runner already mounts
# (/var/run/docker.sock) rather than a docker:dind service. dind requires the runner to be
# configured `privileged = true`, which this runner is not — and making a shared runner privileged
# to serve one job is a bad trade. The socket works here because integration-test.sh never talks to
# the Cassandra container over the network: it starts the container and drives every command through
# `docker exec`, so the container being a sibling of this job rather than a child changes nothing.
docker-integration-test:
  stage: integration
  timeout: 60m
  needs:
    - job: docker-image
      artifacts: true
  image: docker:27-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  # Overrides the default before_script (apt-get, for the temurin image) — but it cannot be empty:
  # docker:27-cli is Alpine and ships no bash, and integration-test.sh is a #!/bin/bash script using
  # a dozen bash-only constructs. Without this the job dies with "not found" / exit 127 on a script
  # that is present and executable, which is the shebang interpreter missing, not the script.
  # coreutils comes along for GNU date: busybox date silently ignores the %3N in `date +%s%3N`, so
  # every elapsed time in the report would be 0 ms.
  before_script:
    - apk add --no-cache bash coreutils
  # Mirrors docker-image's rules — see the comment on docker-image-publish.
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - docker load -i cassandra-timeseries-6.0.0-docker.tar
    - ./docker/integration-test.sh cassandra-timeseries:6.0.0
  artifacts:
    name: "timeseries-integration-test-report"
    when: always
    paths:
      - build/timeseries-it-report.html
    expire_in: 1 month

# Three real containers on a docker network, RF=3 (docker/cluster-test.sh). Everything it asserts is
# also asserted in-JVM by the timeseries dtest classes, which run on every pipeline; what this adds
# is three separate JVMs, three separate data directories and a repair stream between operating
# system processes.
#
# MANUAL on every ref, including tags — deliberately NOT a release gate. Three JVMs at 2G plus this
# job is more than a shared runner is guaranteed to have, and a release gate that fails on runner
# capacity rather than on the product is worse than no gate. Play it by hand when the cluster path
# has changed (compaction, streaming, tiering) or before a release worth the extra confidence.
docker-cluster-test:
  stage: integration
  timeout: 60m
  needs:
    - job: docker-image
      artifacts: true
  image: docker:27-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  # Alpine ships no bash and cluster-test.sh is #!/bin/bash — see docker-integration-test.
  before_script:
    - apk add --no-cache bash coreutils
  # Must mirror docker-image's rules, for the same reason docker-image-publish does: this job needs
  # docker-image's artifact, and `- when: manual` with no `if` creates the job on EVERY ref. On a ref
  # where docker-image is not created -- any branch that is not the default one -- the need cannot be
  # resolved and GitLab fails the whole pipeline at creation time, before a single job starts. That
  # is what the 6.0.0 mirror branch hit: identical commit, green on master, instantly failed on
  # 6.0.0 with zero jobs and no yaml error to point at.
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - docker load -i cassandra-timeseries-6.0.0-docker.tar
    - ./docker/cluster-test.sh cassandra-timeseries:6.0.0
  after_script:
    - docker rm -f cassandra-ts-cluster-1 cassandra-ts-cluster-2 cassandra-ts-cluster-3 || true
  artifacts:
    name: "timeseries-cluster-test-report"
    when: always
    paths:
      - build/timeseries-cluster-report.html
      - build/timeseries-cluster-report.md
    expire_in: 1 month

# Upload the image tarball to the generic package registry so it has a stable, tokened download URL
# (job artifacts expire; packages do not).
docker-image-publish:
  stage: release
  timeout: 30m
  needs:
    - job: docker-image
      artifacts: true
    - job: docker-integration-test
      artifacts: false
  image:
    name: curlimages/curl:8.10.1
    entrypoint: [""]
  before_script: []
  # Must mirror docker-image's rules: it needs docker-image's artifact, and a job that needs an
  # optional manual job is created as "skipped" if that manual job has not run — so with plain
  # on_success rules here this job could never run on the default branch, only on tags.
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    # Folded block scalar: a plain scalar cannot contain ": " (the JOB-TOKEN header), which broke the pipeline.
    - >-
      curl --fail --silent --show-error -H "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file cassandra-timeseries-6.0.0-docker.tar
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/cassandra-timeseries-docker/${CI_COMMIT_TAG:-6.0.0}/cassandra-timeseries-6.0.0-docker.tar"

# On tag pushes (e.g. 6.0.0-r1), publish a GitLab Release pointing at the built jar.
changelog:
  stage: release
  # Runs on a tag, before the release job that consumes its output.
  #
  # GitLab builds the entries from commits carrying a `Changelog:` trailer (.gitlab/changelog_config.yml).
  # That trailer is the only thing separating this fork's commits from the ~19,000 upstream ones an
  # `apache/cassandra` merge drags in, so a fork commit without it is simply absent here.
  #
  # Needs CHANGELOG_TOKEN: a project access token with `api` + `write_repository`, and a role that
  # may push to `main` if the branch is protected. CI_JOB_TOKEN cannot call this API. Without the
  # variable the job still runs and still produces release notes -- it falls back to the top section
  # of the CHANGELOG.md that is checked out -- but nothing is written back to the repository.
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - |
      set -eu
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog"
      if [ -n "${CHANGELOG_TOKEN:-}" ]; then
        # Write the section into CHANGELOG.md on the default branch. `from` is omitted so GitLab
        # picks the previous tag itself. [skip ci] keeps this commit from starting another pipeline,
        # which would otherwise loop on every release.
        echo "committing CHANGELOG.md for $CI_COMMIT_TAG"
        curl --fail --silent --show-error --request POST \
             --header "PRIVATE-TOKEN: $CHANGELOG_TOKEN" \
             --data "version=$CI_COMMIT_TAG" \
             --data "branch=$CI_DEFAULT_BRANCH" \
             --data "message=Changelog: $CI_COMMIT_TAG [skip ci]" \
             "$API"
        # Same range again, this time just to capture the text for the release description.
        curl --fail --silent --show-error \
             --header "PRIVATE-TOKEN: $CHANGELOG_TOKEN" \
             "$API?version=$CI_COMMIT_TAG" | jq -r .notes > release-notes.md
      else
        echo "CHANGELOG_TOKEN is not set: not writing CHANGELOG.md, falling back to its top section."
        # Everything after the first '## ' heading up to the next one.
        awk '/^## /{ if (seen) exit; seen=1; next } seen' CHANGELOG.md > release-notes.md
      fi
      # An empty description would publish a release with no notes at all, which is worse than a
      # pointer -- and with the trailer convention new, an empty result is the likely first outcome.
      if [ ! -s release-notes.md ]; then
        echo "no changelog entries found for $CI_COMMIT_TAG" >&2
        printf 'No changelog entries were generated for %s. See CHANGELOG.md and CHANGES.txt.\n' \
               "$CI_COMMIT_TAG" > release-notes.md
      fi
      cat release-notes.md
  artifacts:
    paths:
      - release-notes.md
    expire_in: 1 month

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  # Overrides the global before_script (apt-get, for the temurin image): release-cli is
  # alpine-based, so apt-get does not exist and the job dies with exit 127 before its script --
  # and the script itself needs curl, which the image also lacks. Both surfaced on the first tag
  # this job ever ran (v6.0.0-r1): the runners were dead for every earlier tag, so the job's
  # definition had never been executed. Same alpine treatment as docker-integration-test.
  before_script:
    - apk add --no-cache curl
  rules:
    - if: $CI_COMMIT_TAG
  # Upload the artifacts to the generic package registry before creating the release.
  # Job artifacts expire (expire_in above), which would leave a published release pointing at
  # dead links; packages do not. The web artifact routes (/-/jobs/...) additionally authenticate
  # by browser session only -- they ignore PRIVATE-TOKEN and serve the login page with HTTP 200,
  # so `curl -o x.jar` writes HTML. The package route accepts a token and a session alike.
  needs:
    - job: build-jar
      artifacts: true
    - job: docker-integration-test
      artifacts: false
    - job: changelog
      artifacts: true
  script:
    - |
      PKG="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/cassandra-timeseries/$CI_COMMIT_TAG"
      for f in "apache-cassandra-timeseries-${CI_COMMIT_TAG}.jar" "apache-cassandra-timeseries-${CI_COMMIT_TAG}-bin.tar.gz"; do
        echo "uploading $f"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "build/$f" "$PKG/$f"
      done
  release:
    tag_name: "$CI_COMMIT_TAG"
    # release-cli reads a description that names an existing file from that file, so this is the
    # generated changelog section rather than the literal path. The changelog job guarantees the
    # file exists and is non-empty.
    description: "./release-notes.md"
    assets:
      links:
        # Generic package registry, not job artifacts. Artifacts expire (see build-jar's
        # expire_in), which would leave a published release pointing at dead links; packages do
        # not. The web artifact routes (/-/jobs/...) are worse still: they authenticate by browser
        # session only, ignore PRIVATE-TOKEN, and serve the login page with HTTP 200 -- so
        # `curl -o release.jar` writes an 11 KB HTML file named .jar and nothing fails until it is
        # in lib/ and the node will not start. The package route accepts a token and a session alike.
        - name: "apache-cassandra-timeseries-${CI_COMMIT_TAG}-bin.tar.gz"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/cassandra-timeseries/$CI_COMMIT_TAG/apache-cassandra-timeseries-${CI_COMMIT_TAG}-bin.tar.gz"
        - name: "apache-cassandra-timeseries-${CI_COMMIT_TAG}.jar"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/cassandra-timeseries/$CI_COMMIT_TAG/apache-cassandra-timeseries-${CI_COMMIT_TAG}.jar"
